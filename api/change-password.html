<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · Change Password</title>
<style>
  :root {
    --bg: #0A1020;
    --card: #121a30;
    --border: #232d47;
    --text: #e8ecf6;
    --muted: #8a93ab;
    --saffron: #D9761F;
    --saffron-hover: #c9691a;
    --error: #f04a4a;
    --success: #2fbf71;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #16203c 0%, var(--bg) 60%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .brand {
    text-align: center;
    margin-bottom: 24px;
  }
  .brand .logo {
    font-size: 28px;
    margin-bottom: 6px;
  }
  .brand h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.2px;
  }
  .brand p {
    color: var(--muted);
    font-size: 13px;
    margin: 4px 0 0;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin: 14px 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .input-wrap {
    position: relative;
  }
  input {
    width: 100%;
    background: #0d1426;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 40px 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus {
    border-color: var(--saffron);
  }
  .toggle-eye {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: var(--muted);
    font-size: 16px;
    user-select: none;
    background: none;
    border: none;
    padding: 4px;
  }
  .toggle-eye:hover { color: var(--text); }
  button.primary {
    width: 100%;
    margin-top: 22px;
    background: var(--saffron);
    color: white;
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  button.primary:hover { background: var(--saffron-hover); }
  button.primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .msg {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
    line-height: 1.5;
  }
  .msg.error { background: rgba(240,74,74,0.12); color: var(--error); display: block; }
  .msg.success { background: rgba(47,191,113,0.12); color: var(--success); display: block; }
  .hint {
    color: var(--muted);
    font-size: 11.5px;
    margin-top: 6px;
    line-height: 1.4;
  }
  .strength-bar {
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    margin-top: 8px;
    overflow: hidden;
  }
  .strength-fill {
    height: 100%;
    width: 0%;
    background: var(--error);
    transition: width 0.2s, background 0.2s;
  }
  .switch-link {
    text-align: center;
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .switch-link a {
    color: var(--saffron);
    cursor: pointer;
    text-decoration: none;
    font-weight: 600;
  }
  .switch-link a:hover { text-decoration: underline; }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .step { display: none; }
  .step.active { display: block; }
  .user-badge {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0d1426;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .user-badge b { color: var(--text); }
  .logout-link {
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="logo">🔐</div>
    <h1>MahaMaintain Pro</h1>
    <p>Admin Account Security</p>
  </div>

  <!-- STEP 1: LOGIN -->
  <div id="loginStep" class="step active">
    <label for="loginUsername">Username</label>
    <input id="loginUsername" type="text" autocomplete="username" placeholder="e.g. superadmin" />

    <label for="loginPassword">Password</label>
    <div class="input-wrap">
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" />
      <button type="button" class="toggle-eye" data-target="loginPassword">👁</button>
    </div>

    <button class="primary" id="loginBtn" onclick="handleLogin()">Sign In</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <!-- STEP 2: CHANGE PASSWORD -->
  <div id="changeStep" class="step">
    <div class="user-badge">
      <span>Signed in as <b id="whoAmI"></b></span>
      <span class="logout-link" onclick="logout()">Sign out</span>
    </div>

    <label for="currentPassword">Current Password</label>
    <div class="input-wrap">
      <input id="currentPassword" type="password" autocomplete="current-password" placeholder="Your current password" />
      <button type="button" class="toggle-eye" data-target="currentPassword">👁</button>
    </div>

    <label for="newPassword">New Password</label>
    <div class="input-wrap">
      <input id="newPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters" oninput="updateStrength()" />
      <button type="button" class="toggle-eye" data-target="newPassword">👁</button>
    </div>
    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
    <div class="hint">Must be 8+ characters and include both letters and numbers.</div>

    <label for="confirmPassword">Confirm New Password</label>
    <div class="input-wrap">
      <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter new password" />
      <button type="button" class="toggle-eye" data-target="confirmPassword">👁</button>
    </div>

    <button class="primary" id="changeBtn" onclick="handleChangePassword()">Update Password</button>
    <div id="changeMsg" class="msg"></div>
  </div>
</div>

<script>
const API_BASE = 'https://digitrixmedia.com/mahamaintainpro/api';
let sessionToken = null;

document.querySelectorAll('.toggle-eye').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    input.type = input.type === 'password' ? 'text' : 'password';
  });
});

function showMsg(elId, text, type) {
  const el = document.getElementById(elId);
  el.textContent = text;
  el.className = 'msg ' + type;
}
function clearMsg(elId) {
  const el = document.getElementById(elId);
  el.className = 'msg';
  el.textContent = '';
}

function setLoading(btnId, loading, label) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="spinner"></span>Please wait...' : label;
}

function updateStrength() {
  const val = document.getElementById('newPassword').value;
  const fill = document.getElementById('strengthFill');
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const pct = (score / 4) * 100;
  fill.style.width = pct + '%';
  fill.style.background = score <= 1 ? '#f04a4a' : score <= 2 ? '#f5a623' : score <= 3 ? '#e0c419' : '#2fbf71';
}

async function handleLogin() {
  clearMsg('loginMsg');
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;

  if (!username || !password) {
    showMsg('loginMsg', 'Enter both username and password.', 'error');
    return;
  }

  setLoading('loginBtn', true, 'Sign In');
  try {
    const res = await fetch(`${API_BASE}/admin-login.php`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok || !data.success) {
      showMsg('loginMsg', data.message || 'Login failed', 'error');
      return;
    }
    sessionToken = data.token;
    document.getElementById('whoAmI').textContent = data.username + ' (' + data.role + ')';
    document.getElementById('loginStep').classList.remove('active');
    document.getElementById('changeStep').classList.add('active');
  } catch (e) {
    showMsg('loginMsg', 'Could not reach the server. Check your connection.', 'error');
  } finally {
    setLoading('loginBtn', false, 'Sign In');
  }
}

async function handleChangePassword() {
  clearMsg('changeMsg');
  const currentPassword = document.getElementById('currentPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (!currentPassword || !newPassword || !confirmPassword) {
    showMsg('changeMsg', 'Fill in all fields.', 'error');
    return;
  }
  if (newPassword !== confirmPassword) {
    showMsg('changeMsg', 'New password and confirmation do not match.', 'error');
    return;
  }
  if (newPassword.length < 8 || !/[A-Za-z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
    showMsg('changeMsg', 'New password must be 8+ characters with letters and numbers.', 'error');
    return;
  }

  setLoading('changeBtn', true, 'Update Password');
  try {
    const res = await fetch(`${API_BASE}/change-admin-password.php`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + sessionToken,
      },
      body: JSON.stringify({ current_password: currentPassword, new_password: newPassword }),
    });
    const data = await res.json();
    if (!res.ok || !data.success) {
      showMsg('changeMsg', data.message || 'Failed to update password', 'error');
      return;
    }
    showMsg('changeMsg', '✅ Password updated successfully. Use your new password next time you sign in.', 'success');
    document.getElementById('currentPassword').value = '';
    document.getElementById('newPassword').value = '';
    document.getElementById('confirmPassword').value = '';
    document.getElementById('strengthFill').style.width = '0%';
  } catch (e) {
    showMsg('changeMsg', 'Could not reach the server. Check your connection.', 'error');
  } finally {
    setLoading('changeBtn', false, 'Update Password');
  }
}

function logout() {
  sessionToken = null;
  document.getElementById('changeStep').classList.remove('active');
  document.getElementById('loginStep').classList.add('active');
  document.getElementById('loginPassword').value = '';
  clearMsg('loginMsg');
  clearMsg('changeMsg');
}
</script>

</body>
</html>
