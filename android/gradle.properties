org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable incremental Kotlin compilation due to cache corruption
kotlin.incremental=false
kotlin.incremental.js=false
# Disable Gradle daemon due to loopback connection failure (antivirus/VPN blocking)
org.gradle.daemon=false
# Run Kotlin compiler in-process instead of spawning a separate daemon (avoids loopback socket)
kotlin.compiler.execution.strategy=in-process
